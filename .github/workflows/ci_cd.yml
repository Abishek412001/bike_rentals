name: Enterprise MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Formatting & Linting Check (Ruff / Black / isort)
        run: |
          black --check .
          isort --check-only .
          ruff check .

      - name: Security Scanning (Bandit)
        run: |
          bandit -r src/ -x tests/ -s B101,B104

      - name: Run PyTest Test Suite with Coverage
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml

      - name: Verify Model Training Pipeline Execution
        run: |
          python train_model.py

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Build Docker Container Image
        run: |
          docker build -t bike-demand-platform:latest .

      - name: Verify Docker Compose Config
        run: |
          docker-compose config
